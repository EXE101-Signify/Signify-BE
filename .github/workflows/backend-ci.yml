name: Backend CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**"]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5
      - name: Test and build application
        run: ./gradlew --no-daemon clean check bootJar
      - name: Build Docker image
        run: docker build --tag signify-be:${{ github.sha }} .

  deploy:
    name: Trigger Dokploy deployment
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check Dokploy webhook configuration
        id: webhook
        env:
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        shell: bash
        run: |
          if [[ -z "$DOKPLOY_DEPLOY_WEBHOOK" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "DOKPLOY_DEPLOY_WEBHOOK is not configured; deployment was skipped."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Trigger Dokploy webhook
        if: steps.webhook.outputs.configured == 'true'
        env:
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        shell: bash
        run: |
          set +x
          curl --fail --silent --show-error --max-time 30 --request POST "$DOKPLOY_DEPLOY_WEBHOOK"
