spring:
  config:
    # Local KEY=value file; real environment variables take precedence.
    import: "optional:file:./.env[.properties]"
  application:
    name: signify-be
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jpa:
    hibernate:
      ddl-auto: validate

  servlet:
    multipart:
      max-file-size: ${storage.image.max-size}B
      # Includes multipart headers and boundaries; keep greater than max-file-size.
      max-request-size: ${STORAGE_MULTIPART_MAX_REQUEST_SIZE:6MB}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_MAIL_USERNAME}
    password: ${SMTP_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # Thymeleaf is used only for email template rendering, not web views.
  thymeleaf:
    check-template-location: false

  payos:
    client-id: ${PAYOS_CLIENT_ID}
    api-key: ${PAYOS_API_KEY}
    checksum-key: ${PAYOS_CHECKSUM_KEY}

# JWT
chat:
  presence:
    ttl-ms: ${CHAT_PRESENCE_TTL_MS:90000}
    sweep-ms: ${CHAT_PRESENCE_SWEEP_MS:15000}
    reconcile-ms: ${CHAT_PRESENCE_RECONCILE_MS:60000}

app:
  jwt:
    issuer: ${JWT_ISSUER:signify-be}
    audience: ${JWT_AUDIENCE:signify-client}
    secret: ${JWT_SECRET}
    refresh-encryption-key: ${JWT_REFRESH_ENCRYPTION_KEY:}
    expiration: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

storage:
  provider: ${STORAGE_PROVIDER:s3}
  public-base-url: ${R2_PUBLIC_BASE_URL:}
  presigned-url-duration: ${STORAGE_PRESIGNED_URL_DURATION:15m}

  image:
    max-size: ${STORAGE_IMAGE_MAX_SIZE:5242880}

  r2:
    bucket: ${R2_BUCKET:}
    endpoint: ${R2_ENDPOINT:}
    region: ${R2_REGION:auto}
    access-key: ${R2_ACCESS_KEY:}
    secret-key: ${R2_SECRET_KEY:}
