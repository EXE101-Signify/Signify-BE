databaseChangeLog:
  # --- Changeset 1: Create notification_id_seq ---
  - changeSet:
      id: 017-01-create-notification-id-seq
      author: signify
      preConditions:
        - onFail: MARK_RAN
        - not:
            sequenceExists:
              sequenceName: notification_id_seq
      changes:
        - createSequence:
            sequenceName: notification_id_seq
            dataType: BIGINT
            startValue: 1
            incrementBy: 1

  # --- Changeset 2: Create admin_audit_log_id_seq ---
  - changeSet:
      id: 017-02-create-admin-audit-log-id-seq
      author: signify
      preConditions:
        - onFail: MARK_RAN
        - not:
            sequenceExists:
              sequenceName: admin_audit_log_id_seq
      changes:
        - createSequence:
            sequenceName: admin_audit_log_id_seq
            dataType: BIGINT
            startValue: 1
            incrementBy: 1

  # --- Changeset 3: Set sequence values ---
  - changeSet:
      id: 017-03-set-sequence-values
      author: signify
      changes:
        - sql:
            dbms: postgresql
            sql: |
              SELECT setval('notification_id_seq', GREATEST(COALESCE((SELECT MAX(id) FROM notifications), 0) + 1, 1), false);
              SELECT setval('admin_audit_log_id_seq', GREATEST(COALESCE((SELECT MAX(id) FROM admin_audit_logs), 0) + 1, 1), false);

  # --- Changeset 4: Set default values for id columns ---
  - changeSet:
      id: 017-04-set-default-id-values
      author: signify
      changes:
        - addDefaultValue:
            tableName: notifications
            columnName: id
            columnDataType: BIGINT
            defaultValueSequenceNext: notification_id_seq
        - addDefaultValue:
            tableName: admin_audit_logs
            columnName: id
            columnDataType: BIGINT
            defaultValueSequenceNext: admin_audit_log_id_seq

  # --- Changeset 5: Add metadata column to admin_audit_logs ---
  - changeSet:
      id: 017-05-add-metadata-column
      author: signify
      preConditions:
        - onFail: MARK_RAN
        - not:
            columnExists:
              tableName: admin_audit_logs
              columnName: metadata
      changes:
        - addColumn:
            tableName: admin_audit_logs
            columns:
              - column:
                  name: metadata
                  type: TEXT

  # --- Changeset 6: Add columns to event_publication ---
  - changeSet:
      id: 017-06-add-event-publication-columns
      author: signify
      preConditions:
        - onFail: MARK_RAN
        - not:
            columnExists:
              tableName: event_publication
              columnName: last_resubmission_date
      changes:
        - addColumn:
            tableName: event_publication
            columns:
              - column:
                  name: last_resubmission_date
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: completion_attempts
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(30)

  # --- Changeset 7: Create event_publication_archive table ---
  - changeSet:
      id: 017-07-create-event-publication-archive
      author: signify
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: event_publication_archive
      changes:
        - createTable:
            tableName: event_publication_archive
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
              - column:
                  name: listener_id
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: event_type
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: serialized_event
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: publication_date
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: completion_date
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: last_resubmission_date
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: completion_attempts
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(30)

  # --- Changeset 8: Create indexes ---
  - changeSet:
      id: 017-08-create-notification-index
      author: signify
      preConditions:
        - onFail: MARK_RAN
        - not:
            indexExists:
              indexName: idx_notifications_user_read_created
      changes:
        - createIndex:
            tableName: notifications
            indexName: idx_notifications_user_read_created
            columns:
              - column:
                  name: user_id
              - column:
                  name: is_read
              - column:
                  name: created_at

  - changeSet:
      id: 017-09-create-audit-admin-index
      author: signify
      preConditions:
        - onFail: MARK_RAN
        - not:
            indexExists:
              indexName: idx_admin_audit_logs_admin_created
      changes:
        - createIndex:
            tableName: admin_audit_logs
            indexName: idx_admin_audit_logs_admin_created
            columns:
              - column:
                  name: admin_id
              - column:
                  name: created_at

  - changeSet:
      id: 017-10-create-audit-target-index
      author: signify
      preConditions:
        - onFail: MARK_RAN
        - not:
            indexExists:
              indexName: idx_admin_audit_logs_target
      changes:
        - createIndex:
            tableName: admin_audit_logs
            indexName: idx_admin_audit_logs_target
            columns:
              - column:
                  name: target_type
              - column:
                  name: target_id

  - changeSet:
      id: 017-11-create-event-publication-index
      author: signify
      preConditions:
        - onFail: MARK_RAN
        - not:
            indexExists:
              indexName: idx_event_publication_completion_date
      changes:
        - createIndex:
            tableName: event_publication
            indexName: idx_event_publication_completion_date
            columns:
              - column:
                  name: completion_date
