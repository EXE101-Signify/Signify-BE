
databaseChangeLog:
  - changeSet:
      id: 024-update-admin-audit-logs-metadata-type
      author: signify

      preConditions:
        - onFail: HALT
        - onError: HALT
        - columnExists:
            schemaName: public
            tableName: admin_audit_logs
            columnName: metadata

      changes:
        - sql:
            sql: |
              ALTER TABLE public.admin_audit_logs
              ALTER COLUMN metadata TYPE JSONB
              USING metadata::jsonb;
