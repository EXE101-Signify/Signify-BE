databaseChangeLog:
  - changeSet:
      id: 009-create-message-reaction
      author: signify
      changes:
        - createTable:
            tableName: message_reaction
            columns:
              - column:
                  name: reaction_id
                  type: BIGINT
                  constraints:
                    primaryKey: true
              - column:
                  name: message_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: reaction
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: BIGINT
        - addForeignKeyConstraint:
            baseTableName: message_reaction
            baseColumnNames: message_id
            referencedTableName: message
            referencedColumnNames: message_id
            constraintName: fk_reaction_message
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: message_reaction
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: user_id
            constraintName: fk_reaction_user
            onDelete: CASCADE
