databaseChangeLog:
  - changeSet:
      id: 005-create-conversation
      author: signify
      changes:
        - createTable:
            tableName: conversation
            columns:
              - column:
                  name: conversation_id
                  type: BIGINT
                  constraints:
                    primaryKey: true
              - column:
                  name: type
                  type: VARCHAR(20)
                  defaultValue: PRIVATE
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: BIGINT
                  constraints:
                    nullable: false
