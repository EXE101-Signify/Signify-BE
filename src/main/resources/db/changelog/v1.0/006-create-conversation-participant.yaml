databaseChangeLog:
  - changeSet:
      id: 006-create-conversation-participant
      author: signify
      changes:
        - createTable:
            tableName: conversation_participant
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
              - column:
                  name: conversation_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: joined_at
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: last_read_message_id
                  type: BIGINT
              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: conversation_participant
            baseColumnNames: conversation_id
            referencedTableName: conversation
            referencedColumnNames: conversation_id
            constraintName: fk_conv_participant_conversation
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: conversation_participant
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: user_id
            constraintName: fk_conv_participant_user
            onDelete: CASCADE
