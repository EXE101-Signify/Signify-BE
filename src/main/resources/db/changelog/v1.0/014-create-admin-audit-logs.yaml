databaseChangeLog:
  - changeSet:
      id: 014-create-admin-audit-logs
      author: signify
      changes:
        - createTable:
            tableName: admin_audit_logs
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
              - column:
                  name: admin_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: action
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: target_type
                  type: VARCHAR(50)
              - column:
                  name: target_id
                  type: BIGINT
              - column:
                  name: reason
                  type: TEXT
              - column:
                  name: created_at
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: admin_audit_logs
            baseColumnNames: admin_id
            referencedTableName: users
            referencedColumnNames: user_id
            constraintName: fk_admin_audit_logs_admin
