databaseChangeLog:
  - changeSet:
      id: 010-create-user-blocks
      author: signify
      changes:
        - createTable:
            tableName: user_blocks
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
              - column:
                  name: created_at
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: deleted_at
                  type: BIGINT
              - column:
                  name: blocker_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: blocked_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: user_blocks
            baseColumnNames: blocker_id
            referencedTableName: users
            referencedColumnNames: user_id
            constraintName: fk_user_blocks_blocker
        - addForeignKeyConstraint:
            baseTableName: user_blocks
            baseColumnNames: blocked_id
            referencedTableName: users
            referencedColumnNames: user_id
            constraintName: fk_user_blocks_blocked
